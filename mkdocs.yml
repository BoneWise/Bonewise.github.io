site_name: Zhe Hu | Computational Neuroscience
site_url: https://huzhe3566.com/
site_author: Zhe Hu

theme:
  name: material
  custom_dir: docs/overrides
  # 字体改为站内自托管（docs/assets/fonts），不再请求 Google Fonts
  font: false
  icon:
    logo: zh/sigil
  favicon: assets/images/favicon.svg
  features:
    - navigation.top
  palette:
    # 夜 —— 紫夜星空（晓美焰）
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/white-balance-sunny
        name: "Switch to Day · 昼"

    # 昼 —— 和纸晨空（传颂之物）
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: "Switch to Night · 夜"

extra:
  zh:
    # 顶部横幅大图（可选）。把图片放进 docs/assets/images/ 后填写路径，
    # 例如 assets/images/banner-night.jpg。留空则使用画布绘制的星空 / 晨空。
    banner_night: ""
    banner_day: ""
    github: https://github.com/BoneWise
    notes: https://www.notion.so/210b53648e9180d9816df03c3f8055f7?v=210b53648e9180d19a9d000ca3071a3f&source=copy_link

markdown_extensions:
  - attr_list
  - md_in_html

extra_css:
  - assets/stylesheets/zh-theme.css

extra_javascript:
  - assets/javascripts/zh-theme.js

# 模板源文件只供主题使用，不发布到网站
exclude_docs: |
  overrides/

nav:
  - Welcome!: index.md
  - About Me: cv.md
  - Publications: pubs.md
  - Contact: contact.md
