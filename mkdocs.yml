site_name: Zhe Hu | NeuroAI
site_url: https://huzhe3566.com/
site_author: Zhe Hu

theme:
  name: material
  custom_dir: docs/overrides
  # 字体改为站内自托管（docs/assets/fonts），不再请求 Google Fonts
  font: false
  icon:
    logo: zh/sigil
  favicon: assets/images/favicon.svg
  features:
    - navigation.top
  palette:
    # 夜 —— 紫夜星空（晓美焰）
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/white-balance-sunny
        name: "Switch to Day · 昼"

    # 昼 —— 和纸晨空（传颂之物）
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: "Switch to Night · 夜"

extra:
  zh:
    # 顶部横幅大图（可选）。把图片放进 docs/assets/images/ 后填写路径，
    # 例如 assets/images/banner-night.jpg。留空则使用画布绘制的星空 / 晨空。
    banner_night: ""
    banner_day: ""
    # 各页横幅人物：昼 = 久远（传颂之物），夜 = 晓美焰（魔法少女小圆）。路径相对 docs/。
    # 换图时只改这里；位置与大小在 zh-theme.css 的「横幅人物」一节按页面微调。
    cast:
      home:    { day: assets/images/characters/banner/kuon-home.webp,     night: assets/images/characters/banner/homura-home.webp }
      cv:      { day: assets/images/characters/banner/kuon-about.webp,    night: assets/images/characters/banner/homura-about.webp }
      pubs:    { day: assets/images/characters/banner/kuon-research.webp, night: assets/images/characters/banner/homura-research.webp }
      contact: { day: assets/images/characters/banner/kuon-contact.webp,  night: assets/images/characters/banner/homura-contact.webp }
    # 侧栏像素方阵可轮换的头像（点击切换）
    portraits:
      day:
        - { src: assets/images/characters/portraits/kuon-1.webp, name: "Kuon" }
        - { src: assets/images/characters/portraits/kuon-2.webp, name: "Kuon" }
        - { src: assets/images/characters/portraits/kuon-3.webp, name: "Kuon" }
        - { src: assets/images/characters/portraits/kuon-4.webp, name: "Kuon" }
      night:
        - { src: assets/images/characters/portraits/homura-1.webp, name: "Homura" }
        - { src: assets/images/characters/portraits/homura-2.webp, name: "Homura" }
        - { src: assets/images/characters/portraits/homura-3.webp, name: "Homura" }
    github: https://github.com/BoneWise
    notes: https://www.notion.so/210b53648e9180d9816df03c3f8055f7?v=210b53648e9180d19a9d000ca3071a3f&source=copy_link

# 全站只有几页，不需要站内搜索
plugins: []

markdown_extensions:
  - attr_list
  - md_in_html

extra_css:
  - assets/stylesheets/zh-theme.css

extra_javascript:
  - assets/javascripts/zh-theme.js

# 模板源文件只供主题使用，不发布到网站
exclude_docs: |
  overrides/
  assets/images/characters/kuon.png
  assets/images/characters/homura.png
  assets/images/characters/kuon-portrait.png
  assets/images/characters/homura-portrait.png

nav:
  - Welcome!: index.md
  - About Me: cv.md
  - Research: pubs.md
  - Contact: contact.md
